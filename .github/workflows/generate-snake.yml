name: Generate Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hemel2002
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache GitHub streak card
        run: >
          curl
          --fail
          --silent
          --show-error
          --retry 3
          --max-time 60
          --output dist/github-streak.svg
          'https://streak-stats.demolab.com?user=hemel2002&theme=tokyonight&hide_border=false&border=7C3AED&ring=7C3AED&fire=F97316&currStreakLabel=A78BFA&border_radius=12'
          
      - name: Publish profile assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
